<div class="conteiner-esqueceu-senha">
  <div class="cartao-esqueceu-senha">
    <div class="cabecalho-esqueceu-senha">
      <i class="fa-solid fa-scissors icone-esqueceu-senha"></i>
      <h1>CortaAí</h1>
      <p>Esqueceu sua senha?</p>
    </div>

    @if (!enviado) {
      <p class="instrucao">
        Informe seu e-mail cadastrado e enviaremos um link para redefinir sua senha.
      </p>

      <form (ngSubmit)="aoEnviar()" class="formulario-esqueceu-senha">
        @if (erro) {
          <div class="mensagem-erro">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ erro }}
          </div>
        }

        <div class="campo">
          <label for="email">E-mail</label>
          <div class="campo-input">
            <i class="fa-solid fa-envelope"></i>
            <input
              type="email"
              id="email"
              [(ngModel)]="email"
              name="email"
              placeholder="seu@email.com"
              required
            />
          </div>
        </div>

        <button type="submit" class="botao-enviar" [disabled]="carregando || !email">
          @if (carregando) {
            <i class="fa-solid fa-spinner fa-spin"></i> Enviando...
          } @else {
            <i class="fa-solid fa-paper-plane"></i> Enviar link
          }
        </button>
      </form>
    } @else {
      <div class="container-sucesso">
        <div class="icone-sucesso">
          <i class="fa-solid fa-envelope-circle-check"></i>
        </div>
        <p class="mensagem-sucesso">{{ mensagem }}</p>
        <p class="detalhe-sucesso">Verifique sua caixa de entrada e spam.</p>
      </div>
    }

    <p class="link-voltar">
      <a routerLink="/login"><i class="fa-solid fa-arrow-left"></i> Voltar para o login</a>
    </p>
  </div>
</div>
