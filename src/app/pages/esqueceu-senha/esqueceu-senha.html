<div class="forgot-container">
  <div class="forgot-card">
    <div class="forgot-header">
      <i class="fa-solid fa-scissors forgot-icon"></i>
      <h1>CortaAí</h1>
      <p>Esqueceu sua senha?</p>
    </div>

    @if (!enviado) {
      <p class="instrucao">
        Informe seu e-mail cadastrado e enviaremos um link para redefinir sua senha.
      </p>

      <form (ngSubmit)="onSubmit()" class="forgot-form">
        @if (erro) {
          <div class="erro-msg">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ erro }}
          </div>
        }

        <div class="campo">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope"></i>
            <input
              type="email"
              id="email"
              [(ngModel)]="email"
              name="email"
              placeholder="seu@email.com"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn-enviar" [disabled]="carregando || !email">
          @if (carregando) {
            <i class="fa-solid fa-spinner fa-spin"></i> Enviando...
          } @else {
            <i class="fa-solid fa-paper-plane"></i> Enviar link
          }
        </button>
      </form>
    } @else {
      <div class="sucesso-container">
        <div class="sucesso-icon">
          <i class="fa-solid fa-envelope-circle-check"></i>
        </div>
        <p class="sucesso-msg">{{ mensagem }}</p>
        <p class="sucesso-detalhe">Verifique sua caixa de entrada e spam.</p>
      </div>
    }

    <p class="link-voltar">
      <a routerLink="/login"><i class="fa-solid fa-arrow-left"></i> Voltar para o login</a>
    </p>
  </div>
</div>
